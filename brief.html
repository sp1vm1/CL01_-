<title>6시 브리핑 — 시사이슈 요약</title>
<style>
:root{
  --bg:#F7F8FA; --card:#FFFFFF; --ink:#1B2430; --muted:#66707D; --line:#E3E6EB;
  --accent:#0E7263; --accent-soft:#E4F0ED;
  --up:#D6493E; --down:#3568C9;
  --chip:#F0F2F5;
  font-size:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181F; --card:#1C222B; --ink:#E8EAEE; --muted:#8A93A0; --line:#2A313C;
    --accent:#4DB6A3; --accent-soft:#1E2F2B; --up:#E06A60; --down:#6B93E0; --chip:#242B36; }
}
:root[data-theme="dark"]{ --bg:#14181F; --card:#1C222B; --ink:#E8EAEE; --muted:#8A93A0; --line:#2A313C;
  --accent:#4DB6A3; --accent-soft:#1E2F2B; --up:#E06A60; --down:#6B93E0; --chip:#242B36; }
:root[data-theme="light"]{ --bg:#F7F8FA; --card:#FFFFFF; --ink:#1B2430; --muted:#66707D; --line:#E3E6EB;
  --accent:#0E7263; --accent-soft:#E4F0ED; --up:#D6493E; --down:#3568C9; --chip:#F0F2F5; }

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  line-height:1.55;
}
a{color:inherit}

/* ── 지수 티커 ── */
.ticker{
  background:var(--card); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:10;
}
.ticker-inner{
  max-width:960px; margin:0 auto; padding:10px 20px;
  display:flex; gap:28px; overflow-x:auto; scrollbar-width:none;
}
.ticker-inner::-webkit-scrollbar{display:none}
.idx{display:flex; align-items:baseline; gap:8px; white-space:nowrap; font-variant-numeric:tabular-nums;}
.idx .n{font-size:.78rem; color:var(--muted); letter-spacing:.04em;}
.idx .v{font-weight:700; font-size:.95rem;}
.idx .c{font-size:.8rem; font-weight:600;}
.idx .c.up{color:var(--up)} .idx .c.down{color:var(--down)}

/* ── 마스트헤드 ── */
header.mast{max-width:960px; margin:0 auto; padding:36px 20px 8px;}
.mast-row{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap;}
h1{
  margin:0; font-family:"Noto Serif KR","Nanum Myeongjo",Batang,serif;
  font-size:1.9rem; letter-spacing:-.01em; text-wrap:balance;
}
h1 .dot{color:var(--accent)}
.mast-sub{color:var(--muted); font-size:.85rem; margin-top:4px;}

/* 기간 토글 */
.period{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card);}
.period button{
  border:0; background:transparent; color:var(--muted); padding:8px 18px;
  font:inherit; font-size:.88rem; font-weight:600; cursor:pointer;
}
.period button.on{background:var(--accent); color:#fff;}
.period button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

/* ── 카테고리 탭 ── */
nav.tabs{
  max-width:960px; margin:18px auto 0; padding:0 20px;
  display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--line);
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0; background:none; font:inherit; font-size:.95rem; cursor:pointer;
  padding:10px 14px 12px; color:var(--muted); white-space:nowrap; font-weight:600;
  border-bottom:2px solid transparent; margin-bottom:-1px;
}
.tab.on{color:var(--ink); border-bottom-color:var(--accent);}
.tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
.tab-more{
  border:0; background:none; font:inherit; cursor:pointer; line-height:1;
  padding:10px 12px 14px; margin-left:auto; margin-bottom:-1px;
  color:var(--muted); opacity:.22; font-size:.9rem; font-weight:700; letter-spacing:.1em;
  border-bottom:2px solid transparent; transition:opacity .15s;
}
.tab-more:hover{opacity:.65;}
.tab-more.on{opacity:.8; color:var(--ink);}
.tab-more:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; opacity:1;}

/* ── 본문 ── */
main{max-width:960px; margin:0 auto; padding:20px 20px 60px;}
html,body{max-width:100%; overflow-x:hidden;}
@media (max-width:520px){
  .spark .xl-1,.spark .xl-3,.spark .xl-5{display:none;}
  main{padding:16px 14px 48px;}
  header.mast{padding:24px 14px 6px;}
  nav.tabs{padding:0 14px;}
  .ticker-inner{padding:10px 14px; gap:20px;}
  .stock{padding:14px 14px;}
  .card{padding:14px 15px;}
  h1{font-size:1.6rem;}
}
.asof{font-size:.82rem; color:var(--muted); margin:6px 0 18px;}
.asof b{color:var(--accent); font-weight:700;}

.cards{display:flex; flex-direction:column; gap:12px;}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  padding:16px 18px;
}
.card h3{margin:0 0 6px; font-size:1.02rem; line-height:1.4;}
.card h3 a{text-decoration:none;}
.card h3 a:hover{text-decoration:underline; text-decoration-color:var(--accent);}
.card p{margin:0 0 10px; font-size:.92rem; color:var(--ink);}
.meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:.78rem; color:var(--muted);}
.chip{background:var(--chip); border-radius:5px; padding:2px 8px; font-weight:600;}
.rank{
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:22px; border-radius:6px; background:var(--accent-soft);
  color:var(--accent); font-weight:700; font-size:.8rem; margin-right:8px;
  font-variant-numeric:tabular-nums;
}
.link{color:var(--accent); text-decoration:none; font-weight:600;}
.link:hover{text-decoration:underline;}
.subhead{
  margin:26px 0 12px; font-size:.8rem; font-weight:700; letter-spacing:.08em;
  color:var(--muted); text-transform:uppercase;
  display:flex; align-items:center; gap:10px;
}
.subhead::after{content:""; flex:1; height:1px; background:var(--line);}
.empty{
  text-align:center; color:var(--muted); padding:60px 20px; font-size:.92rem;
  background:var(--card); border:1px dashed var(--line); border-radius:10px;
}
.archbar{margin:-6px 0 16px;}
.arch-toggle,.arch-reset,.chip-btn{
  border:1px solid var(--line); background:var(--card); color:var(--muted);
  font:inherit; font-size:.8rem; font-weight:600; border-radius:7px; padding:5px 12px; cursor:pointer;
}
.arch-toggle:hover,.chip-btn:hover{color:var(--ink);}
.arch-reset{margin-left:8px; color:var(--accent); border-color:var(--accent);}
.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.chip-btn.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.cal{margin-top:10px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; max-width:340px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:.9rem;}
.cal-head button{border:0; background:none; color:var(--muted); cursor:pointer; font:inherit; padding:2px 8px;}
.cal-head button:hover{color:var(--ink);}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px; text-align:center;}
.cal-grid .dow{font-size:.7rem; color:var(--muted); padding:4px 0;}
.cal-day{font-size:.82rem; padding:6px 0; color:var(--muted); border-radius:6px; border:0; background:none; font:inherit; font-variant-numeric:tabular-nums;}
.cal-day.pad{visibility:hidden;}
button.cal-day.has{color:var(--ink); background:var(--accent-soft); cursor:pointer; font-weight:600;}
button.cal-day.has:hover{outline:2px solid var(--accent);}
.cal-day.sel{background:var(--accent); color:#fff;}

/* 수원 행사 달력 */
.sw-cal{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; max-width:460px; margin-bottom:4px;}
.sw-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; font-size:.92rem;}
.sw-head button{border:0; background:none; color:var(--muted); cursor:pointer; font:inherit; padding:2px 10px; border-radius:6px;}
.sw-head button:hover{color:var(--ink); background:var(--chip);}
.sw-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
.sw-grid .dow{font-size:.7rem; color:var(--muted); padding:2px 0 4px;}
.sw-day{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  min-height:38px; border:0; background:none; font:inherit; border-radius:7px; color:var(--muted);
  font-variant-numeric:tabular-nums; padding:3px 0;}
.sw-day .d{font-size:.82rem; line-height:1.2;}
.sw-day .dots{font-size:.5rem; line-height:1; letter-spacing:.08em; color:var(--accent); height:.62em;}
.sw-day.pad{visibility:hidden;}
button.sw-day.has{color:var(--ink); background:var(--accent-soft); cursor:pointer; font-weight:700;}
button.sw-day.has:hover{outline:2px solid var(--accent);}
button.sw-day.sel{background:var(--accent); color:#fff;}
button.sw-day.sel .dots{color:#fff;}
.sw-long{margin:-2px 0 9px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.sw-long .lbl{font-size:.7rem; font-weight:700; color:var(--muted); letter-spacing:.04em;}
.sw-long .chip{font-size:.72rem; font-weight:600; background:var(--accent-soft); color:var(--accent); border-radius:5px; padding:2px 8px;}
.sw-foot{margin-top:10px; font-size:.78rem; color:var(--muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.sw-reset{border:1px solid var(--accent); background:none; color:var(--accent); font:inherit; font-size:.76rem; font-weight:600; border-radius:6px; padding:3px 9px; cursor:pointer;}
@media (max-width:520px){ .sw-cal{max-width:100%;} }
.card.buzz{border-left:3px solid var(--up);}
.card.buzz .kw{
  display:inline-block; font-size:.72rem; font-weight:700; letter-spacing:.02em;
  color:var(--up); background:color-mix(in srgb, var(--up) 12%, transparent);
  border-radius:5px; padding:2px 8px; margin-bottom:8px;
}
.stocks-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(400px,100%),1fr)); gap:14px;}
.stock{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px;}
.s-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.s-id{display:flex; align-items:baseline; gap:8px; min-width:0;}
.s-name{font-weight:700; font-size:.98rem;}
.s-tick{font-size:.72rem; color:var(--muted); letter-spacing:.03em;}
.s-tag{font-size:.68rem; font-weight:700; border-radius:5px; padding:2px 7px; white-space:nowrap;
  color:var(--accent); background:var(--accent-soft);}
.s-tag.hot{color:var(--up); background:color-mix(in srgb, var(--up) 12%, transparent);}
.s-num{display:flex; align-items:baseline; gap:8px; font-variant-numeric:tabular-nums;}
.s-price{font-weight:700; font-size:1.05rem;}
.s-num .c{font-size:.82rem; font-weight:600;}
.s-num .c.up{color:var(--up)} .s-num .c.down{color:var(--down)}
.s-note{font-size:.82rem; color:var(--muted); margin-top:8px; line-height:1.55;}
.spark{display:block; width:100%; height:auto; margin:10px 0 2px;}
footer{
  max-width:960px; margin:0 auto; padding:20px; border-top:1px solid var(--line);
  font-size:.78rem; color:var(--muted); line-height:1.8;
}
</style>

<div class="ticker"><div class="ticker-inner" id="ticker"></div></div>

<header class="mast">
  <div class="mast-row">
    <div>
      <h1>6시 브리핑<span class="dot">.</span></h1>
      <div class="mast-sub" id="updatedAt"></div>
    </div>
    <div class="period" role="tablist" aria-label="기간 선택">
      <button data-p="daily" class="on">일간</button>
      <button data-p="weekly">주간</button>
      <button data-p="monthly">월간</button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main>
  <div class="asof" id="asof"></div>
  <div class="archbar" id="archbar"></div>
  <div id="content"></div>
</main>

<footer>
  매일 오전 6시 전날 이슈 · 매주 월요일 오전 6시 주간 정리 · 매달 1일 오전 6시 월간 정리로 자동 업데이트됩니다.<br>
  요약은 AI가 생성하며, 정확한 내용은 각 기사 원문을 확인하세요. 투자 판단의 근거가 아니며 투자 자문이 아닙니다.<br>
  출처: 조선·중앙·동아일보(네이버뉴스 경유), 연합뉴스, 한국경제, 매일경제, 네이버 뉴스랭킹, 펀덱스, CGV, 유튜브, 네이버 금융, 야후 파이낸스, 기독교 언론 등.
</footer>

<script>
/* ==== FORMAT NOTE (자동 갱신 에이전트 필독 — 2026-08-21 사용자 지시로 확정된 형식) ====
   1. 주식 카드 구성(2026-08-21 사용자 확정) — 국장·미장 각각 8장:
      (a) 첫 카드 = 지수. 국장 'KOSPI 지수'(ticker:KOSPI), 미장 'S&P 500 지수'(ticker:^GSPC). tag:"지수"
      (b) 다음 5장 = 그날 기준 시가총액 TOP5. tag:"시총 1위"~"시총 5위"
          국장 순위: https://m.stock.naver.com/api/stocks/marketValue/KOSPI?page=1&pageSize=12 (우선주 제외)
          미장 순위: 시총 랭킹 사이트(fool.com/research/largest-companies-by-market-cap 등) 확인
      (c) 마지막 2장 = 그날 가장 화제였던 종목(급등·급락·상한가). tag:"🔥 급등"/"🔥 급락"/"🔥 상한가"
      모든 카드에 spark/sparkDates 필수(7거래일). 지수 spark는 네이버 index API·야후 ^GSPC로 받는다.
   2. 증시 이슈는 issues 하나가 아니라 issuesKr(국내 10건) / issuesUs(미국 10건)로 나눠 작성. 렌더러가 두 키를 지원함.
      (과거 archive의 구형 issues 키는 변환하지 말고 그대로 보존 — 렌더러가 함께 지원함)
   3. 주간·월간 브리핑도 일간과 똑같은 8장 구성(지수+시총TOP5+핫2)을 쓴다. 다만 차트 단위가 다르다.
      주간: 주별 마지막 거래일 종가 7주치, sparkDates는 주 시작일 "MM/DD"(예: 06/29 07/06 ... 08/10)
      월간: 월별 마지막 거래일 종가 7개월치, sparkDates는 "N월"(예: 1월 2월 ... 7월)
      핫2는 그 주/그 달의 등락률 상·하위 종목(시총 TOP5 제외)으로 고른다.
   4. 그날 ±10% 이상 폭등·폭락한 초대형 화제 종목은 (c)의 핫 카드로 넣고 이슈 최상단에 배치할 것.
   6. 국장 섹션 맨 위 금·환율 카드(2026-08-31 사용자 지시): stocks.macro 배열에 정확히 2장 —
      ① 국제 금 시세(name "국제 금 시세", ticker "GC=F (온스)", tag "🥇 금", price는 "$4,470.80" 형태)
      ② 원/달러 환율(name "원/달러 환율", ticker "USD/KRW", tag "💱 환율", price는 "1,374.77" 형태, $ 없음)
      시세는 야후 `query1.finance.yahoo.com/v8/finance/chart/GC%3DF` 와 `.../KRW%3DX` (range=1y&interval=1d).
      spark·sparkDates 7개는 필수이고 일반 종목과 같은 기간 단위를 쓴다(일간=거래일, 주간=주 시작일 MM/DD, 월간="N월").
      금 카드 note에는 원화 환산 원/g 값을 함께 적는다(온스가 ÷ 31.1034768 × 환율).
   5. 기독교 탭(2026-08-21 사용자 지시, 2차 구체화): cat 필드로 소제목 그룹핑. 코너별 성격이 다르다 —
      "⚠️ 이단 동향" = 신천지 등 이단 관련 재판·포교·논란.
      "🎤 화제의 강단" = 지금 청년들 사이에서 이슈가 되는 설교자·설교 콘텐츠(예: 다윗의열쇠 김선교 선교사, 인스타그램 페이지처치, 유튜브 숏폼 설교 등). 교단 소식이 아니라 '사람과 메시지'.
      "🌱 청년·다음세대" = 청년 신앙 트렌드(숏폼 성경앱, 이탈 통계, 새 사역 모델 등).
      "🎵 찬양·예배" = 요즘 뜨는 찬양팀·찬양곡(위러브·제이어스·마커스·어노인팅 신보, CCM 차트, 화제의 집회).
      기타는 "교계 일반". 카테고리당 1~3건씩 유연하게, 총 5~8건. cat 없는 과거 데이터는 평면 렌더되므로 변환 금지.
      **중복 금지(2026-08-21 지적): 같은 인물·같은 사건은 하루 1건만.** 이만희 심문 기사를 2건 실었다가 지적받았다.
      **이단 다양화: 신천지만 반복하지 말 것.** 통일교(한학자 재판)·JMS(정명석)·하나님의교회 등 그날 움직임이 있는 이단을 고루 살펴라. 이단 전문 소스: 현대종교(hdjk.co.kr)·교회와신앙(amennews.com)·뉴스앤조이.
      단 **한 종목이 issuesKr/issuesUs 10건 중 2건을 넘지 않게 한다**(2026-08-21 모더나 5/10 도배로 지적받음).
      나머지는 지수·금리·환율·정책·다른 종목 실적 등으로 고르게 채운다.
      신규 종목은 직전 종가 역산으로 spark 2~3개 점이라도 채울 것.
   7. 수원 탭(2026-09-14 사용자 지시): sections.suwon 배열에 5~6건. 각 {title, summary, source, url, date, when(행사 일시 "9/18(금)~19(토) 17:30~21:30" 형태), place(장소)}.

function spark(vals, dir, dates, priceStr){
  if(!Array.isArray(vals) || vals.length<2) return "";
  const usd = typeof priceStr === "string" && priceStr.indexOf("$") >= 0;
  const fmt = v => usd
    ? "$" + (v >= 1000 ? v.toFixed(0) : v.toFixed(2))
    : Math.round(v).toLocaleString("en-US");
  const lab = (Array.isArray(dates) && dates.length===vals.length) ? dates : null;
  const FS=13;
  const loV=Math.min(...vals), hiV=Math.max(...vals);
  const widest=Math.max(...[hiV,(loV+hiV)/2,loV].map(v=>fmt(v).length));
  const W=400, H=150, padR=12, padT=12, padB=lab?30:12;
  const padL=Math.min(96, Math.max(40, Math.round(widest*FS*0.56)+10));
  const x0=padL, x1=W-padR, y0=padT, y1=H-padB;
  let min=Math.min(...vals), max=Math.max(...vals);
  if(max-min < 1e-9){ const p=Math.abs(max)*0.01||1; min-=p; max+=p; }
  const pad=(max-min)*0.12; min-=pad; max+=pad;
  const span=max-min;
  const X=i=>x0+i/(vals.length-1)*(x1-x0);
  const Y=v=>y1-((v-min)/span)*(y1-y0);
  const pts=vals.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const col=dir==="up"?"var(--up)":"var(--down)";
  const last=pts[pts.length-1];

  const lo=loV, hi=hiV, mid=(lo+hi)/2;
  const grid=[hi,mid,lo].map(v=>{
    const y=Y(v).toFixed(1);
    return `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>`
         + `<text x="${x0-7}" y="${(+y+3.2).toFixed(1)}" text-anchor="end" font-size="${FS}" fill="var(--muted)" class="ax">${esc(fmt(v))}</text>`;
  }).join("");

  let xaxis="";
  if(lab){
    xaxis=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="var(--line)" stroke-width="1"/>`
      + pts.map((p,i)=>{
          const a = i===0 ? "start" : (i===pts.length-1 ? "end" : "middle");
          return `<line x1="${p[0].toFixed(1)}" y1="${y1}" x2="${p[0].toFixed(1)}" y2="${y1+4}" stroke="var(--line)" stroke-width="1"/>`
               + `<text x="${p[0].toFixed(1)}" y="${y1+17}" text-anchor="${a}" font-size="${FS}" fill="var(--muted)" class="ax xl xl-${i}">${esc(lab[i])}</text>`;
        }).join("");
  }
  const cap = lab ? `<title>${esc(lab[0])}~${esc(lab[lab.length-1])} 종가 추이 (${esc(fmt(lo))}~${esc(fmt(hi))})</title>` : "";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 종가 추이">${cap}
    <line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" stroke="var(--line)" stroke-width="1"/>
    ${grid}
    <polygon points="${pts[0][0].toFixed(1)},${y1} ${line} ${last[0].toFixed(1)},${y1}" fill="${col}" opacity="0.10"/>
    <polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.2" fill="${col}"/>${xaxis}</svg>`;
}

/* ── 수원 행사 달력 (2026-09-15 사용자 지시) ──
   when 문자열("9/18(금)~19(토) 17:30~21:30", "9/9(수) ... (종료)")에서 날짜만 뽑아
   달력에 표시한다. 시각(17:30~21:30)과 괄호는 먼저 지운 뒤 M/D 패턴을 읽는다. */
let swMonth = null, swSel = null;

function swDates(it){
  const y0 = /^\d{4}/.test(it.date||"") ? +String(it.date).slice(0,4) : 2026;
  let t = String(it.when||"")
    .replace(/\d{1,2}\s*:\s*\d{2}/g, " ")
    .replace(/\([^)]*\)/g, " ");
  const out = new Set(), used = [];
  const taken = i => used.some(u => i >= u[0] && i < u[1]);
  const addSpan = (m1,d1,m2,d2) => {
    const a = new Date(y0, m1-1, d1), b = new Date(y0, m2-1, d2);
    if(isNaN(a) || isNaN(b) || b < a) return;
    for(let x = new Date(a), n = 0; x <= b && n < 200; x.setDate(x.getDate()+1), n++){
      out.add(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`);
    }
  };
  let re, m;
  re = /(\d{1,2})\s*\/\s*(\d{1,2})\s*~\s*(\d{1,2})\s*\/\s*(\d{1,2})/g;
  while((m = re.exec(t))){ addSpan(+m[1],+m[2],+m[3],+m[4]); used.push([m.index, re.lastIndex]); }
  re = /(\d{1,2})\s*\/\s*(\d{1,2})\s*~\s*(\d{1,2})(?!\s*\/)/g;
  while((m = re.exec(t))){ if(taken(m.index)) continue; addSpan(+m[1],+m[2],+m[1],+m[3]); used.push([m.index, re.lastIndex]); }
  re = /(\d{1,2})\s*\/\s*(\d{1,2})/g;
  while((m = re.exec(t))){ if(taken(m.index)) continue; addSpan(+m[1],+m[2],+m[1],+m[2]); }
  return [...out];
}

function swCal(map, longRun){
  // 기본 달: 이 브리핑의 기준일이 속한 달. 그 달에 행사가 없으면 행사가 가장 많은 달.
  const all = Object.keys(map).concat((longRun||[]).reduce((a,o)=>a.concat(o.days), []));
  if(!swMonth || !all.some(k => k.slice(0,7) === swMonth)){
    const cur = String(sel[curP] || DATA.updatedAt || "").slice(0,7);
    if(cur && all.some(k => k.slice(0,7) === cur)) swMonth = cur;
    else {
      const cnt = {};
      all.forEach(k => { const mo = k.slice(0,7); cnt[mo] = (cnt[mo]||0) + 1; });
      swMonth = Object.keys(cnt).sort((a,b) => cnt[b]-cnt[a] || a.localeCompare(b))[0] || cur || "2026-01";
    }
  }
  const y = +swMonth.split("-")[0], mo = +swMonth.split("-")[1];
  const startDow = new Date(y, mo-1, 1).getDay(), days = new Date(y, mo, 0).getDate();
  let cells = "";
  for(let i=0;i<startDow;i++) cells += `<span class="sw-day pad"></span>`;
  for(let d=1; d<=days; d++){
    const k = `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const n = (map[k]||[]).length;
    if(n) cells += `<button class="sw-day has${swSel===k?" sel":""}" data-sw-k="${k}" `
      + `aria-label="${mo}월 ${d}일 행사 ${n}건" title="행사 ${n}건">`
      + `<span class="d">${d}</span><span class="dots">${n<=3 ? "•".repeat(n) : n+"건"}</span></button>`;
    else cells += `<span class="sw-day"><span class="d">${d}</span></span>`;
  }
  const inMonth = (longRun||[]).filter(o => o.days.some(k => k.slice(0,7) === swMonth));
  const longLine = inMonth.length
    ? `<div class="sw-long"><span class="lbl">이달 내내</span>${inMonth.map(o=>`<span class="chip">${esc(o.it.title.replace(/^[^'’]*['’]([^'’]+)['’].*$/, "$1").slice(0,24))}</span>`).join("")}</div>`
    : "";
  const dows = ["일","월","화","수","목","금","토"].map(d=>`<span class="dow">${d}</span>`).join("");
  const foot = swSel
    ? `<span><b>${+swSel.slice(5,7)}월 ${+swSel.slice(8,10)}일</b> 행사 ${(map[swSel]||[]).length}건</span><button class="sw-reset" data-sw-reset>전체 보기</button>`
    : `<span>날짜를 누르면 그날 행사만 봅니다 · 점 하나가 행사 하나</span>`;
  return `<div class="sw-cal">
    <div class="sw-head"><button data-sw-nav="-1" aria-label="이전 달">◀</button><b>${y}년 ${mo}월</b><button data-sw-nav="1" aria-label="다음 달">▶</button></div>
    ${longLine}
    <div class="sw-grid">${dows}${cells}</div>
    <div class="sw-foot">${foot}</div>
  </div>`;
}

  } else if(curC==="stocks"){

        const day = map[swSel] || [];
        const ongoing = longRun.filter(o => o.days.includes(swSel)).map(o => o.it);
        body = `<div class="subhead">${+swSel.slice(5,7)}/${+swSel.slice(8,10)} 행사 ${day.length}건</div>`
          + `<div class="cards">${day.map(eventCard).join("")}</div>`
          + (ongoing.length ? `<div class="subhead">이 기간 계속되는 행사 ${ongoing.length}건</div><div class="cards">${ongoing.map(eventCard).join("")}</div>` : "");
      } else {
        body = `<div class="subhead">수원시 행사·축제 ${arr.length}건 — 시청·문화재단·공식 SNS·뉴스 종합</div>`
          + `<div class="cards">${arr.map(eventCard).join("")}</div>`
          + (undated.length ? `<div class="sw-foot">기간이 특정되지 않은 ${undated.length}건은 달력에 표시되지 않습니다.</div>` : "");
      }
      html = `<div class="subhead">행사 달력 — 날짜별로 한눈에</div>` + swCal(map, longRun) + body;
    }
  } else {
    const arr = s[curC]||[];
    html = arr.length ? `<div class="cards">${arr.map(newsCard).join("")}</div>` : `<div class="empty">${emptyMsg()}</div>`;
  }
  el.innerHTML = html;
}

document.querySelector(".period").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  curP = b.dataset.p;
  document.querySelectorAll(".period button").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
document.getElementById("tabs").addEventListener("click", e=>{
  if(e.target.closest("[data-more]")){
    showHidden = !showHidden;
    if(!showHidden && HIDDEN_CATS.some(c=>c.key===curC)) curC = "buzz";
    render(); return;
  }
  const b = e.target.closest(".tab"); if(!b) return;
  curC = b.dataset.c; render();
});
document.getElementById("archbar").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.toggle!==undefined){ calOpen=!calOpen; render(); return; }
  if(b.dataset.reset!==undefined){ sel[curP]=null; render(); return; }
  if(b.dataset.nav){
    const y=+calMonth.split("-")[0], m=+calMonth.split("-")[1]-1+(+b.dataset.nav);
    const d=new Date(y, m, 1);
    calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    render(); return;
  }
  if(b.dataset.k){ sel[curP]=b.dataset.k; render(); }
});

document.getElementById("content").addEventListener("click", e=>{
  const nav = e.target.closest("[data-sw-nav]");
  if(nav){
    const y = +swMonth.split("-")[0], mo = +swMonth.split("-")[1]-1 + (+nav.dataset.swNav);
    const d = new Date(y, mo, 1);
    swMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    render(); return;
  }
  if(e.target.closest("[data-sw-reset]")){ swSel = null; render(); return; }
  const day = e.target.closest("[data-sw-k]");
  if(day){ swSel = (swSel === day.dataset.swK) ? null : day.dataset.swK; render(); return; }
});

renderTicker(); render();
</script>
